name: CI
# Pins follow whatever each action publishes. checkout/artifact/gitleaks ship a
# floating major (`@v7`), so that tracks patches for free. setup-uv ships only
# exact versions, so it has to be pinned to one — which is why Dependabot files
# a PR for each of its releases and none for the others.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  UV_VERSION: "0.12.0"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          ignore-nothing-to-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  typecheck:
    name: Type Check (mypy + pyright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          ignore-nothing-to-cache: true
      # --all-extras matters: without the semantic extra installed, both
      # checkers see unresolved imports rather than real types.
      - run: uv sync --all-extras
      - run: uv run mypy
      - run: uv run pyright

  # The suite runs TWICE, in both supported install shapes. This is the
  # load-bearing job in the file.
  #
  # A lexical-only install is a supported configuration, not a degraded one,
  # and it exercises different code: the semantic modules are never imported,
  # the arm reports itself absent, search falls back to lexical. A suite run
  # only with the extra installed never executes any of that, and an
  # ImportError there reaches a user as a server that will not start.
  test:
    name: Tests (${{ matrix.install }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - install: lexical-only
            sync: "uv sync"
          - install: with-semantic
            sync: "uv sync --extra semantic"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          ignore-nothing-to-cache: true
      # Sync EXACTLY the shape under test. Not `--all-extras` plus a
      # `--no-extra` flag at run time: that flag does not uninstall anything,
      # so both legs would import the extra and silently test the same thing.
      - name: install (${{ matrix.install }})
        run: ${{ matrix.sync }}
      - name: pytest (${{ matrix.install }})
        # The floor is checked on the combined total in the `coverage` job, so
        # this leg records data without enforcing anything — on its own it is
        # missing whatever the other shape covers.
        run: uv run pytest tests -q --cov --cov-report= --cov-fail-under=0
        env:
          COVERAGE_FILE: .coverage.${{ matrix.install }}
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.install }}
          path: .coverage.${{ matrix.install }}
          include-hidden-files: true
          retention-days: 1
      - name: the lexical-only env must genuinely lack the extra
        if: matrix.install == 'lexical-only'
        # Guards the matrix against becoming a no-op again.
        run: |
          if uv run python -c "import sqlite_vec" 2>/dev/null; then
            echo "semantic extra present in the lexical-only leg"; exit 1
          fi

  # One floor over both install shapes combined. Enforcing per shape would fail
  # each leg for the paths only the other one reaches, and taking whichever leg
  # is higher would quietly stop measuring the lexical-only fallbacks.
  coverage:
    name: Coverage floor
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          ignore-nothing-to-cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: uv sync
      - name: Combine both shapes and enforce the floor
        # The floor itself lives in pyproject under [tool.coverage.report].
        run: |
          uv run coverage combine .coverage.lexical-only .coverage.with-semantic
          uv run coverage report

  # Packaging faults are invisible to the test suite, which imports from
  # source: a module missing from the wheel or a broken entry point still
  # passes everything. `serve` has already shipped a startup crash once.
  # This installs the real artifact and runs it.
  smoke:
    name: Wheel smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          ignore-nothing-to-cache: true
      - name: Build the wheel, install it clean, and run it
        # Deliberately `make smoke` rather than an inlined copy. The two used to
        # diverge: this job passed with `--root corpus` while the Makefile used
        # `--root .smoke/corpus` and failed on a path bug, so the gate a
        # contributor runs by hand was broken and CI could not see it.
        run: make smoke
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
