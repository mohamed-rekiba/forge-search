name: Publish

# Publishes to PyPI when a version tag is pushed (`v0.2.0`).
#
# One package, so the tag is just the version — the original's
# `<package>-v<version>` scheme and its package-picking dispatch input
# existed to disambiguate seven workspace members and are not needed here.
#
# Authentication is PyPI Trusted Publishing (OIDC): no token is stored
# anywhere in this repo. The PyPI project must list this repository, this
# workflow filename, and the `pypi` environment as a Trusted Publisher before
# the first publish can succeed — until then the upload is rejected by PyPI,
# which is the correct fail-closed behaviour.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"   # pre-releases: v0.2.0-rc.1
  # Manual trigger, and NOT a convenience. release-please creates its tag
  # using the default GITHUB_TOKEN, and GitHub deliberately does not start new
  # workflow runs from events raised by that token — so the tag push above
  # will not fire this workflow when the release PR is merged. Without this
  # entry the release chain would end silently at a tag with nothing
  # published, which looks identical to success.
  #
  # No inputs: the run's own ref selector already lists tags, so you pick
  # `v0.2.0` there and it becomes GITHUB_REF_NAME. An input asking for the
  # tag again would only add a second copy that can disagree with the first.
  #
  # To make the chain fully automatic, give release-please a PAT (or a GitHub
  # App token) instead of GITHUB_TOKEN in release-please.yml.
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  UV_VERSION: "0.12.0"

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    steps:
      # Publishing must only ever happen from a tag. A dispatch from a branch
      # would build whatever that branch currently holds — which is not what
      # any tag names, and is unreproducible the moment the branch moves.
      - name: Refuse to publish from anything but a tag
        if: github.ref_type != 'tag'
        run: |
          echo "This workflow publishes a tagged release."
          echo "Got ${{ github.ref_type }} '${{ github.ref_name }}'."
          echo "Re-run it and pick a tag in the 'Use workflow from' selector."
          exit 1

      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Tag must match the version in pyproject.toml
        # A tag that disagrees with the packaged version publishes something
        # nobody can reproduce from the tag. Cheap to check, expensive to
        # discover after release — PyPI will not let a version be replaced.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match pyproject version $pkg"; exit 1
          fi

      - run: uv build --out-dir dist

      - name: The built wheel must actually run
        # The same reasoning as CI's smoke job, and it matters more here:
        # this artifact is the one strangers install.
        run: |
          uv venv .smoke
          VIRTUAL_ENV=.smoke uv pip install "$(ls dist/*.whl | head -1)"
          .smoke/bin/forge-search --help > /dev/null
          mkdir -p corpus && echo "validate_token" > corpus/a.md
          .smoke/bin/forge-search search validate_token --root corpus | grep -q a.md

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/forge-search
    permissions:
      id-token: write  # required for Trusted Publishing; no token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
