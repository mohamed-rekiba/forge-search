[project]
name = "forge-search"
version = "1.2.0"
description = "Local code and docs search over one or many repositories, served as an MCP tool."
readme = "README.md"
authors = [
    { name = "Muhammad Shaban", email = "muhammad.shaban.dev@gmail.com" }
]
requires-python = ">=3.14"
license = { text = "MIT" }

dependencies = [
    "mcp>=2.0.0,<3",
]

[project.optional-dependencies]
# All four are imported directly in `src/`, so all four get their major bounded
# for the same reason `mcp` does — see the note on `dependencies` above. The two
# 0.x pins bound at `<1`: pre-1.0 projects are entitled to break on a minor, but
# a major is the boundary the resolver can actually be stopped at, and pinning
# minors here would mean churn on every release.
#
# `numpy` belongs here, not in `dependencies`: both call sites are function-local
# imports inside the semantic paths (`OnnxEmbedder.encode`, the cross-encoder's
# `score`), so a lexical-only install neither has it nor reaches it. It was
# undeclared until now and arrived only as a transitive of `onnxruntime`, whose
# own `numpy>=1.21.6` is unbounded — so a third party's requirement chose the
# major this code ran against.
semantic = [
    "numpy>=2.5.2,<3",
    "onnxruntime>=1.29.0,<2",
    "sqlite-vec>=0.1.9,<1",
    "tokenizers>=0.23.1,<1",
]

# Empty on purpose. HTTP transport needs no extra: `mcp` requires starlette and
# uvicorn unconditionally, so a base install already has everything both the
# `streamable-http` and `sse` transports use — verified by starting each one in
# a clean venv with nothing but the wheel. `fastapi` was never used by anything
# here or in the dependency graph.
#
# Kept as a no-op alias rather than deleted so an existing
# `forge-search[http]` install line keeps resolving. See docs/decisions.md.
http = []

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "packaging>=26.3",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.coverage.run]
source = ["forge_search"]
branch = true
# Both install shapes are measured and then combined. Measuring either alone
# understates the other's paths: the lexical-only leg is the only one that runs
# the absent-semantic-arm fallbacks, and the semantic leg is the only one that
# runs the embedder and reranker at all.
parallel = true
# Store paths relative to the project root. Without this, combining works only
# while every leg was recorded at the same absolute path — true for CI today by
# accident of both jobs checking out to the same place, and the failure when it
# stops being true reads like a broken checkout rather than a path mismatch.
relative_files = true

[tool.coverage.report]
# Set at the floor the suite already clears, and meant to ratchet up. Never down:
# lowering it to admit a change is the failure this gate exists to catch.
fail_under = 82
show_missing = true
skip_covered = true

[project.scripts]
forge-search = "forge_search.cli:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
# Deliberately modest. The bugs this project actually shipped were silent
# behavioural gaps — a relative path, an unstamped index, a swallowed error —
# and no linter would have caught any of them. Lint keeps the source tidy; the
# test suite and the clean-install acceptance test do the real work.
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# `src` only. Both checkers are clean here; the errors they raise in `tests`
# are all narrowing limitations (an Optional proven non-None by a preceding
# assertion, unions from the MCP SDK's content types) rather than defects.
# Silencing those one by one would add noise to the tests to satisfy a tool,
# and the tests are verified by running, not by inference.
files = ["src"]
python_version = "3.14"
# Not --strict. The position in [tool.ruff.lint] applies here too: every bug
# this project shipped was a silent behavioural gap no checker would have
# caught. What type checking IS good for here is the seam between CLI and
# server — untyped plumbing there already shipped a startup crash, a keyword
# argument passed to a dataclass with no such field.
warn_unused_ignores = true
warn_redundant_casts = true
# `warn_unreachable` is deliberately off: it flags the Windows branch of
# cache_root() as dead when checked on macOS, and the macOS branch when
# checked on Linux. Correct cross-platform code always has a dead branch
# somewhere, so the warning is noise wherever it runs.

# Neither ships type information. Stubbing them would mean maintaining a
# description of someone else's API; the calls are few and covered by tests.
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "sqlite_vec.*", "tokenizers.*", "mcp.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
