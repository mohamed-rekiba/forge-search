[project]
name = "forge-search"
version = "0.4.2"
description = "Local code and docs search over one or many repositories, served as an MCP tool."
readme = "README.md"
authors = [
    { name = "Muhammad Shaban", email = "muhammad.shaban.dev@gmail.com" }
]
requires-python = ">=3.14"
license = { text = "MIT" }

# The lexical index is SQLite FTS5, which ships inside CPython's stdlib
# sqlite3 — so the base install needs no third-party search dependency at all.
dependencies = [
    "mcp>=1.28.1",
]

[project.optional-dependencies]
# The semantic arm, split out deliberately: the lexical-only install stays
# small and compiler-free, and forge-search is usable before the ~90 MB
# embedding model is ever fetched.
# Both verified to resolve --only-binary=:all: on cp314 (2026-07-21):
#   sqlite-vec 0.1.9 · onnxruntime 1.27.0
semantic = [
    "onnxruntime>=1.28.0",
    "sqlite-vec>=0.1.9",
    "tokenizers>=0.23.1",
]

# HTTP transport. Only needed to run as a long-lived shared server instead of
# a per-session stdio subprocess. See docs/decisions/ on the transport split.
http = [
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[project.scripts]
forge-search = "forge_search.cli:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
# Deliberately modest. The bugs this project actually shipped were silent
# behavioural gaps — a relative path, an unstamped index, a swallowed error —
# and no linter would have caught any of them. Lint keeps the source tidy; the
# test suite and the clean-install acceptance test do the real work.
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# `src` only. Both checkers are clean here; the errors they raise in `tests`
# are all narrowing limitations (an Optional proven non-None by a preceding
# assertion, unions from the MCP SDK's content types) rather than defects.
# Silencing those one by one would add noise to the tests to satisfy a tool,
# and the tests are verified by running, not by inference.
files = ["src"]
python_version = "3.14"
# Not --strict. The position in [tool.ruff.lint] applies here too: every bug
# this project shipped was a silent behavioural gap no checker would have
# caught. What type checking IS good for here is the seam between CLI and
# server — untyped plumbing there already shipped a startup crash, a keyword
# argument passed to a dataclass with no such field.
warn_unused_ignores = true
warn_redundant_casts = true
# `warn_unreachable` is deliberately off: it flags the Windows branch of
# cache_root() as dead when checked on macOS, and the macOS branch when
# checked on Linux. Correct cross-platform code always has a dead branch
# somewhere, so the warning is noise wherever it runs.

# Neither ships type information. Stubbing them would mean maintaining a
# description of someone else's API; the calls are few and covered by tests.
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "sqlite_vec.*", "tokenizers.*", "mcp.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
